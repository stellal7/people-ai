  # ---------------------------------------------------------------------------------------------- headline numbers
  - id: headline_by_year
    description: Flows and attrition by year; rates over average month-end active headcount
    columns: [year, active at year end, hires, rehires, internal moves, voluntary exits, involuntary exits, voluntary %, involuntary %, regretted share of voluntary %]
    plain: [year]
    sql: |
      with hc as (select year(snapshot_date) y, avg(n) avg_hc
                  from (select snapshot_date, count(*) n from employee_snapshot_monthly where employment_status = 'active' group by 1) group by 1),
      ye as (select year(snapshot_date) y, count(*) active from employee_snapshot_monthly
             where employment_status = 'active' and month(snapshot_date) = 12 group by 1),
      ev as (select year(effective_date) y, count(*) filter (where event_type = 'hire') hires,
                    count(*) filter (where event_type = 'rehire') rehires,
                    count(*) filter (where event_type = 'transfer' and event_reason = 'internal_application') internal_moves
             from employment_event where effective_date >= date '2021-01-01' group by 1),
      t as (select year(termination_date) y, count(*) filter (where termination_type = 'voluntary') vol,
                   count(*) filter (where termination_type = 'involuntary') invol, count(*) filter (where regretted_flag) regretted
            from termination group by 1)
      select y, active, hires, rehires, internal_moves, vol, invol, round(100.0 * vol / avg_hc, 1), round(100.0 * invol / avg_hc, 1),
             round(100.0 * regretted / vol, 1)
      from hc join ye using (y) join ev using (y) join t using (y) order by y
    expected:
      - [2021, 3283, 507, 9, 86, 259, 59, 8.3, 1.9, 35.5]
      - [2022, 3733, 803, 43, 114, 315, 73, 9.0, 2.1, 43.5]
      - [2023, 3875, 587, 29, 90, 350, 128, 9.3, 3.4, 39.1]
      - [2024, 4120, 734, 31, 121, 444, 71, 11.1, 1.8, 38.3]
      - [2025, 4434, 803, 57, 106, 448, 95, 10.4, 2.2, 31.7]
  - id: voluntary_attrition_2024_pct
    description: Voluntary attrition 2024, % of average month-end active headcount (layer 2 acceptance)
    sql: |
      select round(100.0 * (select count(*) from termination where termination_type = 'voluntary' and year(termination_date) = 2024)
             / (select avg(n) from (select snapshot_date, count(*) n from employee_snapshot_monthly
                                   where employment_status = 'active' and year(snapshot_date) = 2024 group by 1)), 1)
    expected: 11.1
  - id: regretted_share_2024_pct
    description: Regretted share of 2024 voluntary exits, % (layer 2 acceptance)
    sql: |
      select round(100.0 * count(*) filter (where regretted_flag) / count(*), 1)
      from termination where termination_type = 'voluntary' and year(termination_date) = 2024
    expected: 38.3

  # ---------------------------------------------------------------------------------------------- planted signals
  - id: s1_voluntary_pct_by_vp
    description: "S1: voluntary attrition % in each VP's tree (exits attributed by the chain on the last working day)"
    columns: [VP alias, "2023", "2024", "2025"]
    sql: |
      with heads as (select snapshot_date, org_lvl_2 as vp_alias from employee_snapshot_monthly where employment_status = 'active')
      select v.vp_alias,
        round(100.0 * (select count(*) from v_exits_with_chain x where x.vp_alias = v.vp_alias and x.termination_type = 'voluntary' and year(x.termination_date) = 2023)
              / (select count(*) / 12.0 from heads h where h.vp_alias = v.vp_alias and year(h.snapshot_date) = 2023), 1),
        round(100.0 * (select count(*) from v_exits_with_chain x where x.vp_alias = v.vp_alias and x.termination_type = 'voluntary' and year(x.termination_date) = 2024)
              / (select count(*) / 12.0 from heads h where h.vp_alias = v.vp_alias and year(h.snapshot_date) = 2024), 1),
        round(100.0 * (select count(*) from v_exits_with_chain x where x.vp_alias = v.vp_alias and x.termination_type = 'voluntary' and year(x.termination_date) = 2025)
              / (select count(*) / 12.0 from heads h where h.vp_alias = v.vp_alias and year(h.snapshot_date) = 2025), 1)
      from (select distinct org_lvl_2 as vp_alias from employee_snapshot_monthly where org_lvl_2 is not null) v
      order by 1
    expected:
      - [bahluwal, 10.1, 8.1, 10.8]
      - [glanka, 9.7, 9.8, 10.4]
      - [mmorales, 9.8, 14.1, 11.2]
      - [msmith, 8.1, 9.7, 9.4]
  - id: s1_compa_by_family
    description: "S1: average compa-ratio on June 30"
    columns: [job family, 2023-06-30, 2024-06-30]
    sql: |
      select j.job_family,
             round(avg(c.base_salary / b.mid_salary) filter (where s.snapshot_date = date '2023-06-30'), 2),
             round(avg(c.base_salary / b.mid_salary) filter (where s.snapshot_date = date '2024-06-30'), 2)
      from employee_snapshot_monthly s
      join dim_job j using (job_id)
      join compensation c on c.employee_id = s.employee_id
       and c.effective_date = (select max(effective_date) from compensation c2 where c2.employee_id = s.employee_id and c2.effective_date <= s.snapshot_date)
      join dim_comp_band b on b.job_id = s.job_id and b.location_id = s.location_id and s.snapshot_date between b.valid_from and b.valid_to
      where s.snapshot_date in (date '2023-06-30', date '2024-06-30') and j.job_family in ('Data', 'Engineering', 'Sales')
      group by 1 order by 1
    expected:
      - [Data, 0.99, 0.89]
      - [Engineering, 1.0, 0.94]
      - [Sales, 1.01, 1.0]
  - id: s1_engagement_by_vp
    description: "S1: average engagement score in each VP's tree"
    columns: [VP alias, "2023", "2024"]
    sql: |
      select vp_alias,
             round(avg(engagement_score) filter (where survey_cycle = '2023'), 2),
             round(avg(engagement_score) filter (where survey_cycle = '2024'), 2)
      from v_responses_with_chain where vp_alias is not null group by 1 order by 1
    expected:
      - [bahluwal, 3.72, 3.74]
      - [glanka, 3.72, 3.71]
      - [mmorales, 3.72, 3.21]
      - [msmith, 3.77, 3.74]
