    expected: 70
  - id: s4_other_median_days_to_fill
    description: "S4: median days from approval to fill, other locations"
    sql: select median(date_diff('day', approved_date, closed_date)) from requisition where close_reason = 'filled' and location_id <> 6
    expected: 57
  - id: s5_exits_by_last_rating
    description: "S5: exits by last rating"
    columns: [last rating, voluntary, involuntary]
    sql: |
      select last_rating, count(*) filter (where termination_type = 'voluntary'), count(*) filter (where termination_type = 'involuntary')
